# The validator API behind nginx. setup-server.sh replaces API_DOMAIN and
# installs this; certbot then adds the HTTPS listener and the redirect.

# Only the demo site's backend calls this API, so every request comes from
# one address and limits per visitor are the site's job. This is a ceiling on
# the whole API: each accepted submission costs a fee and a reward.
limit_req_zone $binary_remote_addr zone=s2e_submit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=s2e_read:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=s2e_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    server_tokens off;
    # Just above the API's own 26 MiB limit on a photo, so nginx refuses the
    # truly oversized upload before a byte of it reaches Python.
    client_max_body_size 27m;
    client_body_timeout 30s;
    limit_conn s2e_conn 8;
    limit_req_status 429;

    location = /submissions {
        limit_req zone=s2e_submit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        # A request makes one attempt to settle and waits about a minute for
        # confirmation at most; this leaves room above that.
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=s2e_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

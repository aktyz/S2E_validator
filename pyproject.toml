[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2e-validator"
version = "0.1.0"
description = "Off-chain quality validator for Survey2Earn submissions"
requires-python = ">=3.11"
dependencies = [
    # Decoding uploaded photos (#14). Also the base for perceptual hashing (#16)
    # and face detection (#21). This library reads every contributor's
    # untrusted upload, so the floor is a maintained series rather than the
    # oldest that happens to work, and the cap stops a major release changing
    # decoding behaviour without us noticing. Tested against 12.2.
    "pillow>=11,<13",
    # Face detection (#21): YuNet via cv2.FaceDetectorYN. Headless build, no GUI
    # bindings needed on a server. Capped below 5 for the same reason as Pillow:
    # the bundled face_detection_yunet_2023mar.onnx is the fixed-input-shape
    # model opencv_zoo pairs with OpenCV 4.x. Lifting the cap means swapping in
    # the 5.x model and re-running the face tests.
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The pipeline itself needs none of these. Each extra is one way of running it.
api = [
    # The HTTP service (#43, R1). FastAPI is still 0.x and changes between
    # minors, so the cap is the series it was tested against (0.141).
    "fastapi>=0.115,<0.142",
    # Reads the uploaded photo from a multipart form. This parses untrusted
    # bytes from the internet, so the floor is the release that fixed its
    # denial-of-service bug (CVE-2024-53981).
    "python-multipart>=0.0.18,<1",
    "uvicorn>=0.30,<1",
]
solana = [
    # Signing, address derivation and transaction layout for the reward batch
    # (#43, M2). It signs payouts, so it is pinned to the series the encoding
    # tests ran against. Tested against 0.29.
    "solders>=0.26,<0.30",
]
dev = [
    "pytest>=8",
    # FastAPI's test client needs it.
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Latency tests assert on wall-clock time, which flakes on a shared runner, so
# they are opt-in: `python -m pytest -m slow`.
markers = ["slow: wall-clock latency budgets; run deliberately, on an idle machine"]
addopts = "-m 'not slow'"
